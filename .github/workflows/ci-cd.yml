name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Deve bater com a tag em k8s/deployment.yaml e com a default de var.app_image (infra/).
  APP_IMAGE: ghcr.io/guimullerdev/tech-challenge-fase-one:latest
  CLUSTER_NAME: oficina-cluster
  KIND_VERSION: v0.24.0
  TERRAFORM_VERSION: 1.9.8

jobs:
  # --- Build da aplicação + execução dos testes automatizados ---------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn build
      # test:cov aplica o threshold de cobertura (coverageThreshold do package.json);
      # a pipeline falha se regredir.
      - run: yarn test:cov

  # --- Build da imagem Docker + publicação no GHCR --------------------------
  docker-build-push:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          base=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.base }}:${{ github.sha }}
            ${{ steps.meta.outputs.base }}:latest

  # --- Deploy real: cluster kind efêmero + banco + manifestos, tudo via Terraform ---
  # Roda de ponta a ponta no runner (VM efêmera): sobe um cluster kind, aplica o
  # banco (kubernetes_*), o metrics-server e os manifestos do app (kubectl_manifest),
  # valida o rollout/HPA/health e derruba o cluster. Sem depender de cluster externo.
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem Docker (para carregar no kind)
        run: docker build -t "$APP_IMAGE" .

      - name: Instalar kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        run: terraform -chdir=infra init

      - name: Deploy no cluster (cluster kind + banco + metrics-server + manifestos via terraform)
        run: terraform -chdir=infra apply -auto-approve

      - name: Configurar kubeconfig do cluster kind
        run: |
          kind get kubeconfig --name "$CLUSTER_NAME" > "$HOME/kubeconfig"
          echo "KUBECONFIG=$HOME/kubeconfig" >> "$GITHUB_ENV"

      - name: Smoke test — rollout, HPA e pods
        run: |
          kubectl rollout status deployment/oficina-api -n oficina --timeout=180s
          kubectl get hpa -n oficina
          kubectl get pods -n oficina

      - name: Smoke test — GET /health via port-forward
        run: |
          kubectl port-forward -n oficina svc/oficina-api 8080:80 &
          PF_PID=$!
          sleep 5
          curl -sf http://localhost:8080/health
          kill $PF_PID

      - name: Teardown (cluster efêmero)
        if: always()
        run: terraform -chdir=infra destroy -auto-approve || kind delete cluster --name "$CLUSTER_NAME" || true
