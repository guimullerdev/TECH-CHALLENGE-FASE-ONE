name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn build
      # yarn test:cov enforces the coverage baseline (statements/branches/functions/lines)
      # via jest's coverageThreshold in package.json — the pipeline fails if it regresses.
      - run: yarn test:cov

  docker-build-push:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry image names must be lowercase; github.repository preserves the
      # repo's actual casing (e.g. TECH-CHALLENGE-FASE-ONE), so it can't be used as-is.
      - id: meta
        run: |
          base=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "image=$base:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.base }}:${{ github.sha }}
            ${{ steps.meta.outputs.base }}:latest

  # Explicit, named stage for database migrations (PRÉ-REQ 2 do dev-plan.md).
  # Production migrations are actually applied by entrypoint.sh (`prisma migrate
  # deploy`) when each pod starts — safe under concurrent execution thanks to
  # Prisma's advisory locking. This stage documents that step in the pipeline and
  # runs it explicitly too, so a migration failure is caught before deploy-app
  # rolls out the new image.
  deploy-db:
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - name: Apply pending migrations
        if: env.HAS_DATABASE_URL == 'true'
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Skip (no DATABASE_URL configured)
        if: env.HAS_DATABASE_URL == 'false'
        run: echo "DATABASE_URL secret not set — skipping explicit migration step. Migrations still run via entrypoint.sh when pods start."

  deploy-app:
    needs: [docker-build-push, deploy-db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_KUBE_CONFIG: ${{ secrets.KUBE_CONFIG != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        if: env.HAS_KUBE_CONFIG == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Apply manifests and roll out new image
        if: env.HAS_KUBE_CONFIG == 'true'
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/oficina-api oficina-api=${{ needs.docker-build-push.outputs.image }}
          kubectl rollout status deployment/oficina-api --timeout=180s

      - name: Skip (no KUBE_CONFIG configured)
        if: env.HAS_KUBE_CONFIG == 'false'
        run: echo "KUBE_CONFIG secret not set — skipping deploy-app. Configure it to enable automated rollout to the cluster."
