name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: us-east-1
  # Precisa bater com var.cluster_name do repo oficina-infra-k8s, que é quem
  # provisiona o cluster. Este repo só consome.
  CLUSTER_NAME: oficina-cluster

jobs:
  # --- Build da aplicação + testes automatizados ----------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn build
      # test:cov aplica o threshold de cobertura (coverageThreshold do
      # package.json); a pipeline falha se regredir.
      - run: yarn test:cov

  # --- Build da imagem Docker + publicação no GHCR --------------------------
  docker-build-push:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          base=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # A tag de deploy é o SHA, nunca `latest`: garante que o rollout
          # aponta exatamente para o que este build produziu.
          echo "image=$base:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.base }}:${{ github.sha }}
            ${{ steps.meta.outputs.base }}:latest

  # --- Deploy no EKS --------------------------------------------------------
  # Este repo é dono do deploy da própria aplicação: o repo de infraestrutura
  # (oficina-infra-k8s) só provisiona o cluster e expõe como alcançá-lo.
  # Ver ADR 0001.
  deploy:
    needs: docker-build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && 'true' || 'false' }}
      APP_IMAGE: ${{ needs.docker-build-push.outputs.image }}
      # Branch decide o ambiente (ADR 0002): develop → homolog, main → prod.
      NAMESPACE: ${{ github.ref == 'refs/heads/main' && 'prod' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4

      - name: Aviso — deploy pulado
        if: env.HAS_AWS == 'false'
        run: |
          echo "::warning::Secrets de AWS não configurados; nada foi publicado no cluster."
          echo "::warning::Imagem publicada no GHCR: $APP_IMAGE"

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.HAS_AWS == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Só usado em conta AWS Academy Learner Lab (credencial temporária).
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubeconfig
        if: env.HAS_AWS == 'true'
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      # O Secret é criado a partir dos secrets do repositório, nunca de um
      # arquivo versionado (ver ADR 0001). DATABASE_URL vem do output de
      # oficina-infra-db/bootstrap-db.
      - name: Publicar Secret da aplicação
        if: env.HAS_AWS == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          kubectl create secret generic oficina-api-secret \
            --namespace "$NAMESPACE" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --from-literal=NEW_RELIC_ENABLED="true" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar ConfigMap e Service
        if: env.HAS_AWS == 'true'
        run: |
          kubectl apply -n "$NAMESPACE" -f k8s/configmap.yaml
          kubectl apply -n "$NAMESPACE" -f k8s/service.yaml

      # Migrations antes do rollout: se o schema falhar, a versão nova do
      # código nunca chega a subir contra um banco desatualizado (ADR 0005).
      - name: Rodar migrations (Job) e esperar terminar
        if: env.HAS_AWS == 'true'
        run: |
          export MIGRATION_JOB_NAME="oficina-migrate-${GITHUB_SHA::12}"
          envsubst < k8s/migration-job.yaml | kubectl apply -n "$NAMESPACE" -f -
          if ! kubectl wait -n "$NAMESPACE" --for=condition=complete \
               "job/$MIGRATION_JOB_NAME" --timeout=300s; then
            echo "::error::Migration falhou — rollout abortado. Logs do Job:"
            kubectl logs -n "$NAMESPACE" "job/$MIGRATION_JOB_NAME" --tail=100 || true
            exit 1
          fi

      - name: Aplicar Deployment e HPA
        if: env.HAS_AWS == 'true'
        run: |
          envsubst < k8s/deployment.yaml | kubectl apply -n "$NAMESPACE" -f -
          kubectl apply -n "$NAMESPACE" -f k8s/hpa.yaml

      - name: Aguardar rollout
        if: env.HAS_AWS == 'true'
        run: kubectl rollout status -n "$NAMESPACE" deployment/oficina-api --timeout=300s

      - name: Estado final do ambiente
        if: env.HAS_AWS == 'true'
        run: |
          kubectl get pods,svc,hpa -n "$NAMESPACE" -l app=oficina-api
