# Namespace não é declarado aqui de propósito: o mesmo manifesto é aplicado
# em `homolog` e em `prod`, com `kubectl apply -n $NAMESPACE` decidindo qual
# (ver ADR 0002). `${APP_IMAGE}` é substituído pelo pipeline via envsubst,
# apontando para a tag que aquele build acabou de publicar.
#
# As migrations NÃO rodam aqui: são um Job aplicado antes do rollout
# (k8s/migration-job.yaml, ver ADR 0005). Rodá-las no start do pod faria o
# pod entrar em CrashLoop depois do rollout já ter começado.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  labels:
    app: oficina-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      containers:
        - name: oficina-api
          image: ${APP_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: oficina-api-config
            - secretRef:
                name: oficina-api-secret
          env:
            # Separa homolog de prod no New Relic — sem isso os dois
            # ambientes aparecem misturados na mesma aplicação.
            - name: NEW_RELIC_APP_NAME
              value: oficina-api-${NAMESPACE}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
