# Placeholder values for local/dev use only. In staging/production, create this
# Secret out-of-band (kubectl create secret / sealed-secrets / external-secrets) —
# never commit real credentials here.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secret
  namespace: oficina
  labels:
    app: oficina-api
type: Opaque
stringData:
  DATABASE_URL: "postgresql://oficina:oficina@oficina-db:5432/oficina_db"
  JWT_SECRET: "dev_secret_key"
  WEBHOOK_SECRET: "dev_webhook_secret"
